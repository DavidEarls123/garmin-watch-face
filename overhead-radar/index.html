<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Overhead Radar</title>
<style>
  :root {
    --bg: #000;
    --scope: #06121a;
    --ring: #1d3b4a;
    --text: #d8e6ee;
    --muted: #7f97a6;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  button, input { font: inherit; }
  [hidden] { display: none !important; }
  .gear { position: fixed; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 1px solid #2c5568;
          background: rgba(3,9,13,.7); color: #8fb3c4; font-size: 20px; line-height: 1; display: grid; place-items: center;
          cursor: pointer; opacity: .55; padding: 0; }
  .gear:hover { opacity: 1; }
  :focus-visible { outline: 2px solid #6aa7c4; outline-offset: 2px; }
  .panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); cursor: default; }
  /* sized to fit inside a round screen: the largest square in a circle is ~70% of its diameter */
  .sheet { width: min(70vmin, 380px); max-height: 70vmin; overflow: auto; box-sizing: border-box; background: #0b1820;
           border: 1px solid #2c5568; border-radius: 14px; padding: 14px; color: var(--text); display: grid; gap: 10px;
           font: clamp(11px, 2.6vmin, 14px)/1.35 ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
  .sheet h2 { margin: 0; font-size: 1em; letter-spacing: .1em; text-transform: uppercase; color: #8fb3c4; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .sheet button { background: #10242f; color: var(--text); border: 1px solid #2c5568; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  .sheet button:hover { border-color: #6aa7c4; }
  .sheet button.primary { background: #2f7a8a; border-color: #3d97a9; color: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet label { display: grid; gap: 3px; font-size: .85em; color: var(--muted); min-width: 0; }
  .sheet input { background: #03090d; border: 1px solid #2c5568; color: var(--text); border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0; box-sizing: border-box; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .err { color: #ff8a8a; font-size: .85em; min-height: 1.2em; margin: -4px 0; }
  .fine { color: #4b6675; font-size: .75em; margin: 0; }
  .ctl { position: fixed; width: 13vmin; height: 13vmin; max-width: 64px; max-height: 64px; min-width: 40px; min-height: 40px;
         transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid #2c5568; background: rgba(3,9,13,.72);
         color: #a9c4d2; font: 600 clamp(16px, 5vmin, 26px)/1 ui-monospace, 'DejaVu Sans Mono', monospace; display: grid;
         place-items: center; cursor: pointer; padding: 0; opacity: .7; touch-action: manipulation; }
  .ctl:hover, .ctl:active { opacity: 1; border-color: #6aa7c4; }
  .ctl svg { width: 52%; height: 52%; }
  .check { display: flex !important; align-items: center; gap: 6px; }
  .check input { width: auto; }
  .place-list { display: grid; gap: 6px; }
  .place { display: flex; gap: 6px; }
  .place > button:first-child { flex: 1; text-align: left; border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
  .place small { color: var(--muted); font-size: .8em; }
  .place [aria-current="true"] { border-color: #ffb547; }
  .place .del { border-radius: 10px; padding: 0 10px; color: var(--muted); }
  /* flight detail: a circle that matches the round screen */
  .detail-wrap { background: rgba(0,0,0,.3); }
  .detail { position: relative; width: 94vmin; height: 94vmin; border-radius: 50%; box-sizing: border-box; padding: 9vmin 13vmin 8vmin;
            background: radial-gradient(circle at 50% 40%, rgba(12,34,46,.97), rgba(3,9,13,.97)); border: 2px solid #2c5568;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1vmin; text-align: center;
            color: var(--text); font-family: ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace; overflow: hidden; }
  .detail .close { position: absolute; top: 3.5vmin; left: 50%; transform: translateX(-50%); background: none; border: 0;
                   color: var(--muted); font-size: 6vmin; line-height: 1; cursor: pointer; padding: 1vmin 3vmin; }
  .photo { width: 58vmin; height: 25vmin; border-radius: 2.2vmin; overflow: hidden; background: #06121a; display: grid; place-items: center;
           border: 1px solid #1d3b4a; flex: none; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo svg { width: 80%; height: 92%; }
  .d-call { font-size: 6.2vmin; font-weight: 700; letter-spacing: .04em; line-height: 1.05; }
  .d-op { font-size: 2.5vmin; color: var(--muted); }
  .d-route { font-size: 3.3vmin; line-height: 1.2; }
  .d-route b { font-size: 4.2vmin; }
  .d-route small { display: block; font-size: 2.1vmin; color: var(--muted); }
  .d-type { font-size: 2.4vmin; color: #9fb6c3; }
  .d-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8vmin 3vmin; margin-top: .6vmin; }
  .d-stats div { display: grid; }
  .d-stats span { font-size: 1.8vmin; color: var(--muted); letter-spacing: .08em; }
  .d-stats b { font-size: 3.1vmin; }
  .d-credit { font-size: 1.6vmin; color: #4b6675; max-width: 60vmin; }
</style>
</head>
<body>
<canvas id="scope" aria-label="Radar showing aircraft overhead"></canvas>
<button class="ctl" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (-)">−</button>
<button class="ctl" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
<button class="ctl" id="places-btn" type="button" aria-label="Places" title="Places (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>
<button class="ctl" id="gear" type="button" aria-label="Settings" title="Settings (S)">⚙</button>
<div class="panel" id="panel" hidden>
  <form class="sheet" id="sheet" novalidate>
    <h2>Centre point</h2>
    <div class="chips" id="presets"></div>
    <label for="c-name">Name<input id="c-name" maxlength="16" autocomplete="off"></label>
    <div class="row">
      <label for="c-lat">Latitude<input id="c-lat" inputmode="decimal" autocomplete="off" placeholder="53.2707"></label>
      <label for="c-lon">Longitude<input id="c-lon" inputmode="decimal" autocomplete="off" placeholder="-9.0568"></label>
    </div>
    <div class="err" id="c-err" role="alert"></div>
    <div class="chips">
      <button type="button" id="c-pick">Pick on the map</button>
      <button type="button" id="c-here">Use my location</button>
    </div>
    <label class="check" for="c-keep"><input type="checkbox" id="c-keep" checked> Add to my places list</label>
    <div class="actions">
      <button type="button" id="c-reset">Reset</button>
      <button type="button" id="c-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
    <p class="fine">Tip: paste “53.27, -9.05” straight into Latitude. Tap a plane to see its details. Map data © OpenStreetMap contributors (ODbL).</p>
  </form>
</div>
<div class="panel" id="places" hidden>
  <div class="sheet" role="dialog" aria-label="Places">
    <h2>Places</h2>
    <div class="place-list" id="place-list"></div>
    <div class="actions">
      <button type="button" id="p-new">Add a place…</button>
      <button type="button" id="p-close">Close</button>
    </div>
  </div>
</div>
<div class="panel detail-wrap" id="detail" hidden>
  <div class="detail" role="dialog" aria-label="Flight details">
    <button class="close" id="d-close" type="button" aria-label="Close">×</button>
    <div class="photo" id="d-photo"></div>
    <div class="d-call" id="d-call"></div>
    <div class="d-op" id="d-op"></div>
    <div class="d-route" id="d-route"></div>
    <div class="d-type" id="d-type"></div>
    <div class="d-stats" id="d-stats"></div>
    <div class="d-credit" id="d-credit"></div>
  </div>
</div>
<script src="geo.js"></script>
<script>
(function () {
  'use strict';

  // ---------- configuration ----------
  // Defaults centre on Galway. Override with ?lat=..&lon=..&range=..&demo=1,
  // or let server.py supply them via api/config.
  var params = new URLSearchParams(location.search);
  var CFG = {
    name: 'GALWAY',
    lat: 53.2707,
    lon: -9.0568,
    ranges: [5, 10, 20, 40, 80],
    rangeIdx: 3,
    pollMs: 5000,
    demo: params.get('demo') === '1'
  };
  var DEFAULT_CENTRE = { name: CFG.name, lat: CFG.lat, lon: CFG.lon };
  var CENTRE_KEY = 'overhead-radar-centre';
  function validCentre(c) {
    return c && isFinite(c.lat) && isFinite(c.lon) && Math.abs(c.lat) <= 85 && Math.abs(c.lon) <= 180;
  }
  // Priority: URL parameters, then the centre saved on this screen, then server.py's --lat/--lon, then Galway.
  var urlCentre = params.get('lat') !== null && params.get('lon') !== null;
  var savedCentre = null;
  try { savedCentre = JSON.parse(localStorage.getItem(CENTRE_KEY) || 'null'); } catch (e) { /* storage unavailable */ }
  if (!validCentre(savedCentre)) savedCentre = null;
  if (urlCentre) { CFG.lat = parseFloat(params.get('lat')); CFG.lon = parseFloat(params.get('lon')); }
  else if (savedCentre) { CFG.lat = +savedCentre.lat; CFG.lon = +savedCentre.lon; if (savedCentre.name) CFG.name = String(savedCentre.name).toUpperCase(); }
  if (params.get('name')) CFG.name = params.get('name').toUpperCase();

  var PRESETS = [
    { name: 'Galway', lat: 53.2707, lon: -9.0568 },
    { name: 'Carnmore', lat: 53.3003, lon: -8.9416 },
    { name: 'Shannon', lat: 52.7020, lon: -8.9248 },
    { name: 'Knock', lat: 53.9103, lon: -8.8185 },
    { name: 'Dublin', lat: 53.4213, lon: -6.2701 }
  ];
  try {
    var savedRange = localStorage.getItem('overhead-radar-range');
    if (savedRange !== null && CFG.ranges[+savedRange]) CFG.rangeIdx = +savedRange;
  } catch (e) { /* storage unavailable */ }
  if (params.get('range')) {
    var want = parseFloat(params.get('range'));
    var i = CFG.ranges.indexOf(want);
    if (i >= 0) CFG.rangeIdx = i; else { CFG.ranges.push(want); CFG.rangeIdx = CFG.ranges.length - 1; }
  }

  // Reference points drawn when inside the current range.
  var PLACES = [
    { id: 'EICM', lat: 53.3003, lon: -8.9416, kind: 'apt' },
    { id: 'EINN', lat: 52.7020, lon: -8.9248, kind: 'apt' },
    { id: 'EIKN', lat: 53.9103, lon: -8.8185, kind: 'apt' },
    { id: 'EIIM', lat: 53.1067, lon: -9.6536, kind: 'apt' },
    { id: 'EICA', lat: 53.1147, lon: -9.4678, kind: 'apt' },
    { id: 'Galway', lat: 53.2707, lon: -9.0568, kind: 'town' },
    { id: 'Ennis', lat: 52.8436, lon: -8.9864, kind: 'town' },
    { id: 'Clifden', lat: 53.4893, lon: -10.0193, kind: 'town' },
    { id: 'Athlone', lat: 53.4239, lon: -7.9407, kind: 'town' }
  ];

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FONT = "ui-monospace, 'DejaVu Sans Mono', 'Menlo', 'Consolas', monospace";

  // ---------- geometry (nm, flat-earth around the centre: fine to ~150 nm) ----------
  var D2R = Math.PI / 180;
  function toXY(lat, lon) {
    return [(lon - CFG.lon) * Math.cos(CFG.lat * D2R) * 60, (lat - CFG.lat) * 60];
  }
  function fromXY(x, y) {
    return [CFG.lat + y / 60, CFG.lon + x / (60 * Math.cos(CFG.lat * D2R))];
  }
  function bearingName(x, y) {
    var b = (Math.atan2(x, y) / D2R + 360) % 360;
    return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(b / 45) % 8];
  }

  // ---------- aircraft state ----------
  var planes = new Map(); // hex -> plane
  var status = { source: '', lastOk: 0, error: '' };

  function ingest(list, nowMs) {
    list.forEach(function (a) {
      if (a.lat == null || a.lon == null || !a.hex) return;
      var xy = toXY(a.lat, a.lon);
      var fixT = nowMs - (a.seen || 0) * 1000;
      var p = planes.get(a.hex);
      if (!p) { p = { trail: [] }; planes.set(a.hex, p); }
      var last = p.trail[p.trail.length - 1];
      if (!last || Math.hypot(last[0] - xy[0], last[1] - xy[1]) > 0.15) {
        p.trail.push(xy);
        if (p.trail.length > 40) p.trail.shift();
      }
      p.hex = a.hex;
      p.flight = (a.flight || '').trim() || (a.reg || a.hex.toUpperCase());
      p.reg = a.reg || '';
      p.type = a.type || '';
      p.alt = a.alt;
      p.ground = !!a.ground;
      p.gs = a.gs || 0;
      p.track = a.track;
      p.vr = a.vr || 0;
      p.squawk = a.squawk || '';
      p.cat = a.category || p.cat || '';
      p.x = xy[0]; p.y = xy[1]; p.fixT = fixT;
      p.updated = nowMs;
    });
    planes.forEach(function (p, k) { if (nowMs - p.updated > 60000) planes.delete(k); });
  }

  // Dead-reckon between updates so motion is smooth.
  function posNow(p, nowMs) {
    if (p.track == null || !p.gs || p.ground) return [p.x, p.y];
    var dt = Math.min(Math.max((nowMs - p.fixT) / 1000, 0), 20);
    var d = p.gs * dt / 3600;
    return [p.x + d * Math.sin(p.track * D2R), p.y + d * Math.cos(p.track * D2R)];
  }

  // ---------- live feed ----------
  function fetchJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  var pollTimer = null, pollSeq = 0, live = false;
  function poll() {
    live = true;
    clearTimeout(pollTimer);
    var seq = ++pollSeq;
    fetchJSON('api/aircraft?lat=' + CFG.lat.toFixed(4) + '&lon=' + CFG.lon.toFixed(4)).then(function (j) {
      if (seq !== pollSeq) return; // centre changed while this request was in flight
      ingest(j.aircraft || [], Date.now());
      status.lastOk = Date.now();
      status.error = '';
      status.source = j.source || 'live';
    }).catch(function (e) {
      status.error = String(e.message || e);
    }).then(function () { if (seq === pollSeq) pollTimer = setTimeout(poll, CFG.pollMs); });
  }

  // ---------- land and lake outlines (geo.js), projected once per centre ----------
  var geoPaths = null;
  function buildGeo() {
    var G = window.RADAR_GEO;
    if (!G || !window.Path2D) { geoPaths = null; return; }
    function mk(rings, close) {
      var path = new Path2D();
      rings.forEach(function (r) {
        for (var i = 0; i < r.length; i += 2) {
          var xy = toXY(r[i + 1], r[i]);
          if (i) path.lineTo(xy[0], xy[1]); else path.moveTo(xy[0], xy[1]);
        }
        if (close) path.closePath();
      });
      return path;
    }
    geoPaths = { land: mk(G.land, true), coast: mk(G.coast, false), lakes: mk(G.lakes, true) };
  }

  function setCentre(lat, lon, name, persist) {
    CFG.lat = lat; CFG.lon = lon;
    if (name) CFG.name = String(name).toUpperCase();
    planes.clear();
    status.lastOk = 0;
    buildGeo();
    if (persist) {
      try { localStorage.setItem(CENTRE_KEY, JSON.stringify({ name: name || '', lat: lat, lon: lon })); } catch (e) { /* ignore */ }
    }
    if (live) poll(); else if (status.source === 'DEMO') status.lastOk = Date.now();
  }

  // ---------- demo traffic (used when no server is reachable) ----------
  // Galway sits under the North Atlantic tracks: lots of high westbound traffic by day.
  var demo = [];
  function startDemo() {
    status.source = 'DEMO';
    var seed = [
      // flight, type, reg, alt, gs, track, x, y, vr, turn(deg/s), squawk
      ['DAL41', 'A333', 'N811NW', 37000, 492, 284, 18, -6, 0, 0],
      ['UAL23', 'B789', 'N26960', 39000, 508, 291, -4, 3, 0, 0],
      ['AAL105', 'B77W', 'N717AN', 35000, 476, 279, 30, 12, 0, 0],
      ['BAW117', 'A35K', 'G-XWBA', 38000, 515, 287, 9, -22, 0, 0],
      ['ACA849', 'B788', 'C-GHPQ', 36000, 488, 296, -26, -14, 0, 0],
      ['EIN105', 'A21N', 'EI-LRA', 34000, 470, 283, 36, -2, 0, 0],
      ['RYR4KT', 'B38M', 'EI-HEA', 9800, 290, 18, -3, -30, -1400, 0],
      ['EAI32D', 'AT76', 'EI-HDJ', 14000, 250, 352, 8, -34, 900, 0],
      ['EIBCF', 'C172', 'EI-BCF', 2300, 95, 120, 6, 2.5, 0, 3]
    ];
    var now = Date.now();
    demo = seed.map(function (s, i) {
      return { hex: 'd' + i, flight: s[0], type: s[1], reg: s[2], alt: s[3], gs: s[4], track: s[5],
               x: s[6], y: s[7], vr: s[8], turn: s[9], squawk: s[10] || '7000', t: now };
    });
    demoTick();
    setInterval(demoTick, 1000);
  }
  function demoTick() {
    var now = Date.now(), lim = CFG.ranges[CFG.rangeIdx] * 1.25 + 5;
    var out = demo.map(function (a) {
      var dt = (now - a.t) / 1000; a.t = now;
      a.track = (a.track + a.turn * dt + 360) % 360;
      var d = a.gs * dt / 3600;
      a.x += d * Math.sin(a.track * D2R);
      a.y += d * Math.cos(a.track * D2R);
      a.alt = Math.max(1500, a.alt + a.vr * dt / 60);
      if (Math.hypot(a.x, a.y) > lim) { // re-enter on the far side
        a.x = -a.x * 0.95; a.y = -a.y * 0.95; a.trail = true;
        var p = planes.get(a.hex); if (p) p.trail = [];
      }
      var ll = fromXY(a.x, a.y);
      return { hex: a.hex, flight: a.flight, type: a.type, reg: a.reg, lat: ll[0], lon: ll[1], alt: Math.round(a.alt), category: '',
               gs: a.gs, track: a.track, vr: a.vr, squawk: a.squawk, seen: 0 };
    });
    ingest(out, now);
    status.lastOk = now;
  }

  // ---------- drawing ----------
  var canvas = document.getElementById('scope');
  var ctx = canvas.getContext('2d');
  var S = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    S = Math.min(window.innerWidth, window.innerHeight);
    canvas.style.width = canvas.style.height = S + 'px';
    canvas.width = canvas.height = Math.round(S * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  var ALT_STOPS = [[0, [61, 220, 132]], [10000, [198, 232, 74]], [20000, [255, 181, 71]], [30000, [255, 107, 107]], [40000, [209, 107, 255]]];
  function altColor(alt, ground) {
    if (ground || alt == null) return 'rgb(138,143,152)';
    var a = Math.max(0, Math.min(40000, alt));
    for (var i = 1; i < ALT_STOPS.length; i++) {
      if (a <= ALT_STOPS[i][0]) {
        var lo = ALT_STOPS[i - 1], hi = ALT_STOPS[i], t = (a - lo[0]) / (hi[0] - lo[0]);
        return 'rgb(' + [0, 1, 2].map(function (k) { return Math.round(lo[1][k] + (hi[1][k] - lo[1][k]) * t); }).join(',') + ')';
      }
    }
    return 'rgb(209,107,255)';
  }
  function altText(p) {
    if (p.ground) return 'GND';
    if (p.alt == null) return '—';
    return p.alt >= 10000 ? 'FL' + String(Math.round(p.alt / 100)).padStart(3, '0') : Math.round(p.alt / 100) * 100 + 'ft';
  }
  function vrArrow(vr) { return vr > 300 ? '↑' : vr < -300 ? '↓' : ''; }
  function isEmergency(sq) { return sq === '7500' || sq === '7600' || sq === '7700'; }

  // Right half of a plane silhouette pointing up, unit size; mirrored for the left half.
  var PLANE = [[0, -1], [0.1, -0.82], [0.12, -0.3], [0.95, 0.18], [0.95, 0.34], [0.12, 0.12], [0.09, 0.62], [0.38, 0.84], [0.38, 0.96], [0, 0.86]];
  function drawPlane(x, y, size, track, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((track || 0) * D2R);
    ctx.beginPath();
    PLANE.forEach(function (p, i) { ctx[i ? 'lineTo' : 'moveTo'](p[0] * size, p[1] * size); });
    for (var i = PLANE.length - 2; i > 0; i--) ctx.lineTo(-PLANE[i][0] * size, PLANE[i][1] * size);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.lineWidth = size * 0.12;
    ctx.stroke();
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function frame() {
    var now = Date.now();
    var W = S * dpr, cx = W / 2, cy = W / 2, R = W / 2 * 0.94;
    var range = CFG.ranges[CFG.rangeIdx], k = R / range;
    var u = W / 100; // 1% of screen

  // ---------- input: tap / click / keys cycle the range ----------

      hitTargets.forEach(function (h) { var d = Math.hypot(h.x - tx, h.y - ty); if (d < bestD) { bestD = d; best = h; } });
      if (best) openDetail(best.hex); else selectedHex = null;

    if (!detail.hidden) { if (e.key === 'Escape' || e.key === 'Enter') closeDetail(); return; }
    if (e.key === 'Escape') { picking = false; selectedHex = null; }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); openSettings(); }
    if (e.key === 'l' || e.key === 'L') { e.preventDefault(); openPlaces(); }

      }
      var typeName = [ac.manufacturer, ac.type].filter(Boolean).join(' ');
      dEl.type.textContent = [typeName || p.type, ac.registration || p.reg].filter(Boolean).join(' · ') + (ac.type_code && typeName ? ' (' + ac.type_code + ')' : '');
      if (ac.type_code && !p.type) dEl.photo.innerHTML = silhouetteSVG(typeCategory(ac.type_code, p.cat));
      var credits = [];
      if (ph && ph.src) {
        var img = new Image();
        img.alt = 'Photo of ' + (ac.registration || p.flight);
        img.onload = function () { if (selectedHex === hex) { dEl.photo.innerHTML = ''; dEl.photo.appendChild(img); } };
        img.src = ph.src;
        credits.push('Photo © ' + (ph.photographer || 'unknown') + ' · planespotters.net');
      }
      if (info.demo) credits.push('Demo data');
      else if (rt) credits.push('Route: hexdb.io, may be out of date');
      dEl.credit.textContent = credits.join('  ·  ');
    });
  }
  function closeDetail() { detail.hidden = true; selectedHex = null; clearInterval(detailTimer); clearTimeout(detailIdle); }
  function updateStats() {
    var p = planes.get(selectedHex);
    if (!p) { dEl.stats.innerHTML = '<div style="grid-column:1/-1"><b>Signal lost</b></div>'; return; }
    var pos = posNow(p, Date.now()), d = Math.hypot(pos[0], pos[1]);
    var cells = [['ALT', altText(p) + vrArrow(p.vr)], ['SPEED', Math.round(p.gs) + ' kt'], ['TRACK', p.track != null ? String(Math.round(p.track)).padStart(3, '0') + '°' : '—'],
                 ['V/S', p.vr ? (p.vr > 0 ? '+' : '') + Math.round(p.vr / 50) * 50 + ' fpm' : 'level'], ['DIST', d.toFixed(1) + ' nm ' + bearingName(pos[0], pos[1])], ['SQUAWK', p.squawk || '—']];
    dEl.stats.innerHTML = cells.map(function (c) {
      var hot = c[0] === 'SQUAWK' && isEmergency(p.squawk) ? ' style="color:#ff6b6b"' : '';
      return '<div><span>' + c[0] + '</span><b' + hot + '>' + esc(c[1]) + '</b></div>';
    }).join('');
  }
  document.getElementById('d-close').addEventListener('click', closeDetail);
  detail.addEventListener('click', function (e) { if (e.target === detail) closeDetail(); });

  // ---------- aircraft type outlines (top view, nose up) ----------
  function typeCategory(t, cat) {
    t = (t || '').toUpperCase();
    if (/^(EC\d\d|H1[0-9]{2}|H160|AS3\d\w?|AS\d\d|AW1\d\d|A1[0-9]{2}|B06|B407|B412|B429|R22|R44|R66|MI\d+|NH90|S76|S92|EH10|LYNX|EXPL|BK17)$/.test(t)) return 'heli';
    if (/^(A38\d|B74\w|A34\d|IL96|A124|B52)$/.test(t)) return 'quad';
    if (/^(A306|A30B|A310|A33\d|A35\w|B76\d|B77\w|B78\w|MD11|DC10|C17|K35R)$/.test(t)) return 'wide';
    if (/^(CRJ\d|CRJX|E135|E145|E35L|F70|F100|MD8\d|MD90|B712|DC9\w*)$/.test(t)) return 'rearjet';
    if (/^(A31[89]|A32\d|A19N|A20N|A21N|B73\w|B3[789]M|B3XM|B75\d|BCS\d|C919|E1[7-9]\d|E75\w|E29\d|E2\d\d|SU95|A148)$/.test(t)) return 'narrow';
    if (/^(AT[4-7]\w|ATP|DH8\w|DHC\d|SF34|JS\d\d|D328|B190|BE20|BE30|BE9L|BE99|PC12|C208|AN2\d|L410|F50|SB20|C130|A400|SW4)$/.test(t)) return 'turboprop';
    if (/^(C25\w|C5\d\w|C68A|C700|C750|GLF\d|GL\d\w|GLEX|CL[36]\d|FA\d\w|F2TH|F900|LJ\d\d|E5[05]P|E545|E550|PC24|H25\w|HDJT|PRM1|BE40|SF50|EA50)$/.test(t)) return 'biz';
    if (/^(C1\d\d|C2\d\d|PA\d\w|P28\w|SR2\d|DA\d\w|BE\d\d|M20\w|RV\d+|TB\d+|DR40|AA5|G115|C42|EV97|CTSW|P92|DV20|TECN|AT3T)$/.test(t)) return 'light';
    return { A1: 'light', A2: 'biz', A3: 'narrow', A4: 'narrow', A5: 'wide', A7: 'heli' }[cat] || 'narrow';
  }
  var SHAPES = {
    //        span  len  sweep rootC tipC  wingY tail engines(span fractions)  engine  fuselage-width
    quad:     [0.96, 1.0, 34, 0.25, 0.07, 0.48, 0.34, [0.36, 0.64], 'jet', 0.075],
    wide:     [0.94, 1.0, 32, 0.24, 0.07, 0.48, 0.34, [0.34], 'jet', 0.075],
    narrow:   [0.88, 0.94, 26, 0.2, 0.06, 0.5, 0.32, [0.34], 'jet', 0.06],
    rearjet:  [0.76, 0.9, 24, 0.18, 0.06, 0.5, 0.3, [], 'rear', 0.055],
    turboprop:[0.98, 0.78, 0, 0.12, 0.08, 0.42, 0.3, [0.3], 'prop', 0.055],
    biz:      [0.7, 0.78, 26, 0.17, 0.06, 0.55, 0.3, [], 'rear', 0.05],
    light:    [1.0, 0.68, 0, 0.13, 0.11, 0.38, 0.3, [], 'nose', 0.06]
  };
  var CAT_NAMES = { quad: 'Four-engine widebody', wide: 'Twin-engine widebody', narrow: 'Narrowbody jet', rearjet: 'Regional jet',
                    turboprop: 'Turboprop', biz: 'Business jet', light: 'Light aircraft', heli: 'Helicopter' };
  function silhouetteSVG(cat) {
    // drawn pointing right inside a 200 x 90 box
    var fill = '#3d7f96', line = '#6aa7c4', body = '';
    if (cat === 'heli') {
      body = '<ellipse cx="88" cy="45" rx="26" ry="14" fill="' + fill + '"/><rect x="20" y="42" width="60" height="6" rx="3" fill="' + fill + '"/>' +
             '<rect x="16" y="34" width="6" height="22" rx="2" fill="' + fill + '"/><circle cx="88" cy="45" r="40" fill="none" stroke="' + line + '" stroke-width="2" stroke-dasharray="4 5"/>' +
             '<line x1="48" y1="45" x2="128" y2="45" stroke="' + line + '" stroke-width="3"/><line x1="88" y1="5" x2="88" y2="85" stroke="' + line + '" stroke-width="3"/>';
    } else {
      var sh = SHAPES[cat] || SHAPES.narrow, L = 180 * sh[1], span = 86 * sh[0], half = span / 2, cyy = 45;
      var x0 = 100 + L / 2, x1 = 100 - L / 2; // nose x0, tail x1
      var fw = 200 * sh[9] / 2;
      var wx = x0 - L * sh[5], rc = L * sh[3], tc = L * sh[4], sw = Math.tan(sh[2] * D2R) * half;
      var wing = function (s) { return [[wx, cyy + s * fw], [wx - sw, cyy + s * half], [wx - sw - tc, cyy + s * half], [wx - rc, cyy + s * fw]]; };
      var th = half * sh[6], tsw = Math.tan((sh[2] + 6) * D2R) * th, tx = x1 + L * 0.12;
      var tail = function (s) { return [[tx, cyy + s * fw * 0.7], [tx - tsw, cyy + s * th], [tx - tsw - L * 0.05, cyy + s * th], [tx - L * 0.1, cyy + s * fw * 0.5]]; };
      var poly = function (pts) { return '<polygon points="' + pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '" fill="' + fill + '"/>'; };
      body = poly(wing(1)) + poly(wing(-1)) + poly(tail(1)) + poly(tail(-1)) +
             '<rect x="' + x1.toFixed(1) + '" y="' + (cyy - fw).toFixed(1) + '" width="' + L.toFixed(1) + '" height="' + (2 * fw).toFixed(1) + '" rx="' + fw.toFixed(1) + '" fill="' + fill + '"/>';
      sh[7].forEach(function (f) {
        [1, -1].forEach(function (s) {
          var ey = cyy + s * half * f, ex = wx - sw * f + 6;
          if (sh[8] === 'jet') body += '<rect x="' + (ex - 4).toFixed(1) + '" y="' + (ey - 3.2).toFixed(1) + '" width="16" height="6.4" rx="3" fill="' + line + '"/>';
          else body += '<rect x="' + (ex - 2).toFixed(1) + '" y="' + (ey - 2.5).toFixed(1) + '" width="12" height="5" rx="2" fill="' + line + '"/>' +
                       '<line x1="' + (ex + 10).toFixed(1) + '" y1="' + (ey - 9).toFixed(1) + '" x2="' + (ex + 10).toFixed(1) + '" y2="' + (ey + 9).toFixed(1) + '" stroke="' + line + '" stroke-width="2"/>';
        });
      });
      if (sh[8] === 'rear') [1, -1].forEach(function (s) { body += '<rect x="' + (x1 + L * 0.16).toFixed(1) + '" y="' + (cyy + s * (fw + 3.5) - 3).toFixed(1) + '" width="15" height="6" rx="3" fill="' + line + '"/>'; });
      if (sh[8] === 'nose') body += '<line x1="' + (x0 + 2).toFixed(1) + '" y1="' + (cyy - 11) + '" x2="' + (x0 + 2).toFixed(1) + '" y2="' + (cyy + 11) + '" stroke="' + line + '" stroke-width="2.5"/>';
    }
    return '<svg viewBox="0 0 200 90" role="img" aria-label="' + CAT_NAMES[cat] + ' outline">' + body +
           '<text x="196" y="86" text-anchor="end" font-size="8" fill="#4b6675" font-family="monospace">' + CAT_NAMES[cat].toUpperCase() + '</text></svg>';
  }
  fLat.addEventListener('input', function () {
    // accept "53.27, -9.05" pasted into one box
    var m = fLat.value.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) { fLat.value = m[1]; fLon.value = m[2]; fLon.focus(); }
  });
  gear.addEventListener('click', function () { openSettings(); });
  panel.addEventListener('click', function (e) { if (e.target === panel) closeSettings(); });
  document.getElementById('c-cancel').addEventListener('click', closeSettings);
  document.getElementById('c-pick').addEventListener('click', function () { closeSettings(); picking = true; });
  document.getElementById('c-reset').addEventListener('click', function () {
    try { localStorage.removeItem(CENTRE_KEY); } catch (e) { /* ignore */ }
    fill(serverCentre || DEFAULT_CENTRE);
  });
  if (!navigator.geolocation) hereBtn.hidden = true;
  hereBtn.addEventListener('click', function () {
    fErr.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(function (pos) {
      fill({ name: 'Home', lat: pos.coords.latitude, lon: pos.coords.longitude });
    }, function () {
      fErr.textContent = 'This device couldn’t share its location. Enter it by hand or pick on the map.';
    }, { timeout: 10000 });
  });
  sheet.addEventListener('submit', function (e) {
    e.preventDefault();
    var lat = parseFloat(fLat.value), lon = parseFloat(fLon.value);
    if (!validCentre({ lat: lat, lon: lon })) {
      fErr.textContent = 'Enter latitude between -85 and 85 and longitude between -180 and 180, e.g. 53.27 and -9.05.';
      return;
    }
    var nm = fName.value.trim() || 'Custom';
    setCentre(lat, lon, nm, true);
    if (document.getElementById('c-keep').checked && !PRESETS.some(function (p) { return p.name.toLowerCase() === nm.toLowerCase(); })) addCustomPlace({ name: nm, lat: lat, lon: lon });
    closeSettings();
  });

  // controls sit just inside the scope edge: zoom at 4 and 8 o'clock, places and settings either side of the nearest card
  var CONTROLS = [['zoom-out', 245, 0.8], ['zoom-in', 115, 0.8], ['places-btn', 224, 0.83], ['gear', 136, 0.83]];
  function placeControls() {
    CONTROLS.forEach(function (c) {
      var el = document.getElementById(c[0]), r = S / 2 * 0.94 * c[2], a = c[1] * D2R;
      el.style.left = (window.innerWidth / 2 + Math.sin(a) * r) + 'px';
      el.style.top = (window.innerHeight / 2 - Math.cos(a) * r) + 'px';
    });
  }
  window.addEventListener('resize', placeControls);
  placeControls();

  // ---------- start ----------
  var serverCentre = null;
  buildGeo();
  requestAnimationFrame(frame);
  if (CFG.demo) { startDemo(); return; }
  fetchJSON('api/config').then(function (c) {
    if (c.lat != null) serverCentre = { name: c.name || '', lat: c.lat, lon: c.lon };
    if (!urlCentre && !savedCentre && serverCentre) {
      CFG.lat = c.lat; CFG.lon = c.lon;
      if (!params.get('name') && c.name) CFG.name = String(c.name).toUpperCase();
      buildGeo();
    }
    if (c.poll_seconds) CFG.pollMs = c.poll_seconds * 1000;
    poll();
  }).catch(function () { startDemo(); });
})();
</script>
<!-- ARTIFACT-END -->
